name: VERNIQ CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Tests
        working-directory: ./backend/app
        env:
          SPRING_PROFILES_ACTIVE: test
          VERNIQ_JUDGE_INTERNAL_SECRET: ci-test-internal-secret-placeholder
        run: |
          chmod +x mvnw
          ./mvnw clean test --no-transfer-progress

  frontend-check:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Typecheck
        working-directory: ./frontend
        run: npm run typecheck

      - name: Run Frontend Production Build
        working-directory: ./frontend
        run: npm run build

  judge-check:
    name: Judge Worker Lint & Sanity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: './backend/judge/requirements.txt'

      - name: Install Judge Dependencies
        working-directory: ./backend/judge
        run: pip install -r requirements.txt

      - name: Compile and Verify Python Syntax
        working-directory: ./backend/judge
        run: python -m compileall src/
