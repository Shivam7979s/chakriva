spring:
  application:
    name: verniq-api-test

  datasource:
    url: jdbc:h2:mem:verniq_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

verniq:
  judge:
    internal-secret: test-internal-judge-secret-token-for-unit-tests!

app:
  name: verniq-api
  version: 1.0.0
  environment: test
  judge:
    internal-secret: test-internal-judge-secret-token-for-unit-tests!
  supabase:
    url: http://127.0.0.1:54321
    jwt-secret: test-secret-key-at-least-32-chars-long-for-hs256!
    jwt-audience: authenticated
  cors:
    allowed-origins:
      - http://localhost:5173
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
    allowed-headers:
      - "*"
    max-age-seconds: 3600
