server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: verniq-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # Database DataSource Configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:54322/postgres}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      idle-timeout: 300000
      connection-timeout: 20000
      pool-name: VerniqHikariPool

  # JPA & Hibernate Settings
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # Flyway Migration Integration
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    baseline-version: "20261001000000"
    locations: classpath:db/migration

# Spring Boot Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

# Verniq Application Properties
verniq:
  judge:
    internal-secret: ${VERNIQ_JUDGE_INTERNAL_SECRET:}
    queue-name: ${JUDGE_QUEUE_NAME:${VERNIQ_JUDGE_QUEUE_NAME:verniq:submissions:queue}}
    default-time-limit-ms: ${VERNIQ_JUDGE_DEFAULT_TIME_LIMIT_MS:2000}
    default-memory-limit-mb: ${VERNIQ_JUDGE_DEFAULT_MEMORY_LIMIT_MB:256}

app:
  name: verniq-api
  version: 1.0.0
  environment: ${APP_ENV:local}
  judge:
    internal-secret: ${VERNIQ_JUDGE_INTERNAL_SECRET:}
  supabase:
    url: ${SUPABASE_URL:http://127.0.0.1:54321}
    jwt-secret: ${SUPABASE_JWT_SECRET:}
    jwt-issuer: ${SUPABASE_JWT_ISSUER:}
    jwt-jwk-set-uri: ${SUPABASE_JWT_JWK_SET_URI:}
    jwt-audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGINS:https://verniq.vercel.app}
      - https://verniq.vercel.app
      - ${FRONTEND_URL:http://localhost:5173}
      - http://127.0.0.1:5173
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
    allowed-headers:
      - "*"
    max-age-seconds: 3600
